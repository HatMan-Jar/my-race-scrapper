<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrari Test 999</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #1c1c1e; border-bottom: 2px solid #f2f2f7; padding-bottom: 10px; font-size: 24px; }
        .btn { background-color: #0071e3; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; margin-bottom: 15px; }
        .btn:hover { background-color: #0077ed; }
        .race-card { background: #fbfbfd; border: 1px solid #d2d2d7; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .race-title { font-size: 18px; font-weight: bold; color: #1d1d1f; margin-bottom: 5px; }
        .race-subtitle { font-size: 13px; color: #86868b; margin-bottom: 15px; font-weight: 500; }
        .horse-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e5e5ea; }
        .horse-row:last-child { border-bottom: none; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-strong { background-color: #34c759; color: white; }
        .badge-consider { background-color: #ff9500; color: white; }
        .badge-watch { background-color: #ffcc00; color: #1d1d1f; }
        #api-notes-section { background-color: #f2f2f7; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; color: #86868b; }
    </style>
</head>
<body style="background:red;">

<div class="container">
    <h1>🍾 Ferrari Test 999</h1>
    
    <div id="api-notes-section">
        <strong>Filter Settings:</strong> Handicaps only | <strong>9+ Runners</strong> | <strong>4+ EW Places</strong> | Odds 6/1 - 16/1
    </div>

    <button class="btn" onclick="loadDemoData()">Load Demo Data</button>
    
    <div id="results">
        <p style="color: #86868b; text-align: center;">Click the button above to load and score the races.</p>
    </div>
</div>

<script>
// Updated demo dataset including EW Places
const demoData = [
    {
        course: "Haydock",
        time: "14:30",
        type: "Handicap",
        runners: 11,
        placesPaid: 4, // MEETS CRITERIA (4 places)
        horses: [
            { name: "Champagne Prince", odds: "8/1", features: ["market_move", "ground_suitability", "better_than_result", "handicap_mark", "trainer_form"] },
            { name: "Fast Runner", odds: "4/1", features: ["ground_suitability"] },
            { name: "Noble Dancer", odds: "10/1", features: ["better_than_result", "dropping_class", "jockey_upgrade"] }
        ]
    },
    {
        course: "Newbury",
        time: "15:05",
        type: "Handicap",
        runners: 14,
        placesPaid: 5, // MEETS CRITERIA (5 places + activates 12+ runner bonus)
        horses: [
            { name: "Ferrari Roadster", odds: "12/1", features: ["market_move", "ground_suitability", "dropping_class", "handicap_mark", "draw"] },
            { name: "Steady Eddie", odds: "20/1", features: ["trainer_form"] }
        ]
    },
    {
        course: "Sandown",
        time: "15:40",
        type: "Handicap",
        runners: 10,
        placesPaid: 3, // WILL BE HIDDEN (Less than 4 places)
        horses: [
            { name: "Place Finder", odds: "8/1", features: ["market_move", "ground_suitability"] }
        ]
    }
];

// Exact Ferrari & Champagne Scoring System
function calculateScore(horse, raceRunners, placesPaid) {
    let score = 0;
    
    if (horse.features.includes("market_move")) score += 4;
    if (horse.features.includes("ground_suitability")) score += 3;
    if (horse.features.includes("better_than_result")) score += 3;
    if (horse.features.includes("dropping_class")) score += 3;
    if (horse.features.includes("handicap_mark")) score += 2;
    if (horse.features.includes("jockey_upgrade")) score += 2;
    if (horse.features.includes("trainer_form")) score += 2;
    if (horse.features.includes("draw")) score += 2;
    if (horse.features.includes("lightly_raced")) score += 2;

    // Angle 9: Big-field handicap (12+ runners, 4-5 places) (+3)
    if (raceRunners >= 12 && (placesPaid === 4 || placesPaid === 5)) {
        score += 3;
    }
    
    // Parse odds to check 6/1 - 16/1 angle (+3)
    const parts = horse.odds.split('/');
    if (parts.length === 2) {
        const val = parseFloat(parts[0]) / parseFloat(parts[1]);
        if (val >= 6 && val <= 16) score += 3;
    }
    
    return score;
}

function getVerdict(score) {

    if (score >= 24)
        return '<span class="badge badge-strong">A+ Ferrari 🍾🏎️</span>';

    if (score >= 21)
        return '<span class="badge badge-strong">A Grade</span>';

    if (score >= 18)
        return '<span class="badge badge-consider">B+ Grade</span>';

    if (score >= 15)
        return '<span class="badge badge-watch">B Grade</span>';

    if (score >= 12)
        return '<span class="badge badge-watch">C Grade</span>';

    return '<span class="badge" style="background:#e5e5ea; color:#86868b;">Skip</span>';
}

function loadDemoData() {
    renderRaces(demoData);
}

function renderRaces(races) {
    let allSelections = [];
    const resultsDiv = 
        document.getElementById("results");
    resultsDiv.innerHTML = "";

    // Filter rules: Must be a Handicap, 9+ runners, AND paying 4 or more places
    const filteredRaces = races.filter(race => race.type === "Handicap" && race.runners >= 9 && race.placesPaid >= 4);

    if (filteredRaces.length === 0) {
        resultsDiv.innerHTML = "<p style='text-align:center; color:#86868b;'>No races matched the criteria (Handicaps, 9+ runners, 4+ places).</p>";
        return;
    }

    filteredRaces.forEach(race => {
        let raceHtml = `
            <div class="race-card">
                <div class="race-title">📍 ${race.course} ${race.time}</div>
                <div class="race-subtitle">${race.runners} Runners | Bookmaker Paying: <strong>${race.placesPaid} Places</strong></div>
        `;

        race.horses.forEach(horse => {
            const score = calculateScore(horse, race.runners, race.placesPaid);
            const verdict = getVerdict(score);
            
            raceHtml += `
                <div class="horse-row">
                    <div><strong>${horse.name}</strong> (${horse.odds})</div>
                    <div>Score: <strong>${score}/27</strong> | ${verdict}</div>
                </div>
            `;
        });

        raceHtml += `</div>`;
        resultsDiv.innerHTML += raceHtml;
    });
}
</script>

</body>
</html>
